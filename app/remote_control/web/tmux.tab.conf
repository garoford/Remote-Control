# Remote Control — una sesión tmux por pestaña del túnel web
# El prompt lo pinta el login shell del usuario.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
# Synchronized output (DEC mode 2026): tmux marks where each redraw starts and
# ends, and the page paints it whole (extra_keys.js frameGate): no flicker
# from frames that reach the browser in pieces.
set -as terminal-features ",xterm*:sync"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"
# ttyd's xterm is the scrollback. If tmux switches to the alternate
# screen on attach, that buffer starts empty and the wheel cannot reach
# the lines already stored in the pane history.
set -as terminal-overrides ",xterm-256color:smcup@:rmcup@"
set -as terminal-overrides ",*:smcup@:rmcup@"

set -g default-shell "$SHELL"
set -g default-command ""

# Mouse off: tmux mouse-drag copies and cancels on release, which also
# sends input that makes xterm clearSelection(). Phone scroll is xterm viewport.
set -g mouse off
set -g history-limit 100000
# Historial del celular: copy-mode. scroll-up/down se frenan en los extremos.
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -X scroll-up"
bind -n WheelDownPane send-keys -M
bind -T copy-mode WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode WheelDownPane if-shell -F "#{e|<=:#{scroll_position},0}" "send-keys -X cancel" "send-keys -X scroll-down"
bind -T copy-mode-vi WheelDownPane if-shell -F "#{e|<=:#{scroll_position},0}" "send-keys -X cancel" "send-keys -X scroll-down"
set -sg escape-time 0
# tmux is invisible plumbing here: no prefix key. Ctrl+B belongs to the app
# in the tab (herdr, nano, …), and Ctrl+B d no longer detaches the tab.
set -g prefix None
set -g prefix2 None
unbind C-b
set -g focus-events on
set -g set-clipboard on
set -g aggressive-resize on
# The size belongs to the profile that opened the tab; other profiles attach
# with ignore-size (tab_session.sh), and resize-window keeps the window
# "manual" so they never drive it. Among the owner's devices the one that
# types takes the size (/rc-tab-claim from extra_keys.js); opening, tapping
# or focusing a tab only watches it. A client alone in its session sizes it
# here. Same size: nothing to do. A resize makes herdr ask the terminal for
# its colors again, and herdr keeps one palette for every device, so a no-op
# resize repainted the others.
set-hook -g client-attached 'if -F "#{||:#{||:#{m:*ignore-size*,#{client_flags}},#{!=:#{session_attached},1}},#{&&:#{==:#{window_width},#{client_width}},#{==:#{window_height},#{client_height}}}}" "" { run-shell -C "resize-window -t #{client_session}: -x #{client_width} -y #{client_height}" }'
set-hook -g client-session-changed 'if -F "#{||:#{||:#{m:*ignore-size*,#{client_flags}},#{!=:#{session_attached},1}},#{&&:#{==:#{window_width},#{client_width}},#{==:#{window_height},#{client_height}}}}" "" { run-shell -C "resize-window -t #{client_session}: -x #{client_width} -y #{client_height}" }'
set-hook -g client-resized 'if -F "#{||:#{||:#{m:*ignore-size*,#{client_flags}},#{!=:#{session_attached},1}},#{&&:#{==:#{window_width},#{client_width}},#{==:#{window_height},#{client_height}}}}" "" { run-shell -C "resize-window -t #{client_session}: -x #{client_width} -y #{client_height}" }'
set-hook -gu client-focus-in
# A full-screen clear must not copy the screen into the history: CLIs that
# redraw (see rc_keephistory.py) would fill it with repeated frames.
setw -g scroll-on-clear off
set -g destroy-unattached off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#W"
set -g status off
set -g pane-border-status off
set -g pane-border-style "fg=#011627"
set -g pane-active-border-style "fg=#011627"
# A tab's per-device herdr views (hv-<device>-<tab>, see tab_session.sh)
# close with the tab.
set-hook -g session-closed "run-shell -b 'tmux -S #{socket_path} ls -F \"##{session_name}\" 2>/dev/null | grep -x -- hv-.*-#{hook_session_name} | xargs -r -I{} tmux -S #{socket_path} kill-session -t ={}'"
