# Remote Control — sesión tmux del túnel web
# El prompt lo pinta Oh My Posh (zsh), no esta barra.
# Status off: una barra powerline abajo chocaba con el prompt y se veía como
# "Oh My Posh en la base" sin concordar con nada.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"

set -g default-shell /usr/bin/zsh
set -g default-command "/usr/bin/zsh -il"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#W"
set -g status off
set -g pane-border-status off
set -g pane-border-style "fg=#011627"
set -g pane-active-border-style "fg=#011627"

# El túnel usa `tmux -f` este archivo; no recargar ~/.tmux.conf.
